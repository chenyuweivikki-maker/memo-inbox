<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>灵感收件箱</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --ink-soft: #666666;
    --ink-faint: #aaaaaa;
    --line: #e5e5e5;
    --active: #111111;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ===== 布局 ===== */
  .app { display:flex; min-height:100vh; }

  /* 侧边栏 */
  .sidebar {
    position: fixed; left:0; top:0; bottom:0;
    width: 200px;
    background: var(--bg);
    border-right: 1px solid var(--line);
    padding: 20px 12px;
    overflow-y: auto;
    z-index: 100;
    transition: transform .25s ease;
  }
  .sidebar-title { font-size: 15px; font-weight: 700; letter-spacing: 2px; padding: 4px 8px 16px; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 8px;
    font-size: 14px; color: var(--ink-soft);
    cursor: pointer; transition: background .15s, color .15s;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: #f5f5f5; }
  .nav-item.active { background: var(--active); color: #fff; font-weight: 600; }
  .nav-item .num { font-size: 12px; color: var(--ink-faint); }
  .nav-item.active .num { color: rgba(255,255,255,.7); }
  .sidebar-footer { position:absolute; bottom:20px; left:12px; right:12px; font-size:11px; color:var(--ink-faint); padding:0 4px; }
  .export-btn {
    display:block; width:100%;
    background:none; border:1px solid var(--line); border-radius:8px;
    padding:9px 12px; font-size:13px; color:var(--ink-soft);
    cursor:pointer; transition: all .15s; margin-bottom:8px; font-family:inherit;
  }
  .export-btn:hover { border-color: var(--ink); color: var(--ink); }
  .cat-menu {
    position: fixed; z-index: 300;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,.12);
    min-width: 140px; padding: 6px;
  }
  .cat-menu-title { font-size: 12px; color: var(--ink-faint); padding: 6px 10px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .cat-menu-item {
    padding: 8px 10px; font-size: 13px; color: var(--ink);
    cursor: pointer; border-radius: 6px; transition: background .12s;
  }
  .cat-menu-item:hover { background: #f5f5f5; }
  .cat-menu-item.danger { color: #c0392b; }
  .cat-menu-item.danger:hover { background: #fdf0ef; }

  /* 主区 */
  .main {
    flex: 1;
    margin-left: 200px;
    display: flex; flex-direction: column;
    min-height: 100vh;
  }

  /* 顶部输入区 */
  .composer {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .composer-inner { max-width: 560px; margin: 0 auto; }
  .cat-art { text-align:center; margin-bottom: 8px; }
  textarea {
    width: 100%;
    border: none; outline: none; resize: none;
    font-size: 18px; line-height: 1.7;
    font-family: inherit; color: var(--ink);
    background: transparent; min-height: 90px;
  }
  textarea::placeholder { color: var(--ink-faint); }
  .composer-actions {
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 6px;
  }
  .status { font-size: 13px; color: var(--ink-faint); }
  .btn {
    background: var(--active); color: #fff;
    border: none; border-radius: 50px;
    padding: 12px 28px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  .btn:active { opacity: .7; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* 内容区 */
  .content { flex:1; padding: 20px 24px; max-width: 560px; margin: 0 auto; width:100%; }
  .memo-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: border-color .15s;
  }
  .memo-card:hover { border-color: var(--ink-faint); }
  .memo-card .cat { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--ink-soft); }
  .memo-card .text { font-size: 15px; line-height:1.7; margin-top:6px; white-space:pre-wrap; word-break:break-word; }
  .memo-card .meta { font-size: 11px; color: var(--ink-faint); margin-top:8px; display:flex; align-items:center; justify-content:space-between; }
  .del-btn {
    background:none; border:none; color: var(--ink-faint);
    font-size: 12px; cursor:pointer; padding:2px 6px; border-radius:4px;
    font-family:inherit; transition: all .15s; flex-shrink:0;
  }
  .del-btn:hover { color:#c0392b; background:#fdf0ef; }
  /* 改分类菜单 */
  .cat-menu { position: fixed; z-index: 300; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.12); min-width: 140px; padding: 6px; }
  .cat-menu-title { font-size: 12px; color: var(--ink-faint); padding: 6px 10px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .cat-menu-item { padding: 8px 10px; font-size: 13px; color: var(--ink); cursor: pointer; border-radius: 6px; transition: background .12s; }
  .cat-menu-item:hover { background: #f5f5f5; }
  .cat-menu-item.active { background: #111; color: #fff; }


  .empty { text-align:center; color: var(--ink-faint); padding: 80px 0; font-size: 14px; }
  .loading { text-align:center; color: var(--ink-faint); padding: 40px 0; }

  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color:#fff; padding: 10px 22px; border-radius: 30px;
    font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* 抽屉遮罩（手机） */
  .mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:90; }

  /* 手机端：抽屉式侧边栏 */
  @media (max-width: 640px) {
    .sidebar { transform: translateX(-100%); width: 220px; }
    .sidebar.open { transform: translateX(0); }
    .mask.show { display:block; }
    .main { margin-left: 0; }
    .composer { padding: 20px 16px 16px; }
    .content { padding: 16px; }
    .composer-actions { margin-top: 2px; }
    .hamburger {
      display: flex;
      position: fixed; top: 14px; left: 14px; z-index: 95;
      width: 40px; height: 40px;
      align-items:center; justify-content:center;
      background: var(--bg); border: 1px solid var(--line); border-radius: 50%;
      cursor: pointer;
    }
    .hamburger span, .hamburger span::before, .hamburger span::after {
      content:""; display:block; width:18px; height:2px; background:var(--ink);
      position:relative; transition: all .2s;
    }
    .hamburger span::before { position:absolute; top:-5px; }
    .hamburger span::after { position:absolute; top:5px; }
    .composer { padding-top: 70px; }
  }
  @media (min-width: 641px) { .hamburger { display:none; } }
</style>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="灵感收件箱">
<meta name="theme-color" content="#ffffff">
</head>
<body>
<div class="app">
  <!-- 侧边分类栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">收件箱</div>
    <div id="nav"></div>
    <button class="export-btn" id="addCatBtn">+ 添加分类</button>
    <button class="export-btn" id="exportBtn">导出当前分类</button>
    <div class="sidebar-footer">灵感收件箱</div>
  </aside>
  <div class="mask" id="mask"></div>

  <!-- 主区 -->
  <main class="main">
    <div class="hamburger" id="hamburger" aria-label="打开分类"><span></span></div>
    <div class="composer">
      <div class="composer-inner">
        <div class="cat-art" id="catArt"></div>
        <textarea id="input" placeholder="想到什么就写什么……"></textarea>
        <div class="composer-actions">
          <span class="status" id="status"></span>
          <button class="btn" id="send">丢进去</button>
        </div>
      </div>
    </div>
    <div class="content">
      <div id="list"><div class="loading">…</div></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
let categories = ["日记", "自媒体选题", "好句", "小说灵感", "摘录", "Todo", "其他"]; // 动态加载
let currentCat = "全部";
let allMemos = [];
const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

async function loadCategories() {
  try {
    const res = await fetch("/api/categories");
    const data = await res.json();
    if (data.categories) categories = data.categories;
  } catch (e) { /* 保留默认 */ }
}

async function refreshAll() {
  await loadCategories();
  await loadMemos();
}

function renderNav() {
  const counts = {};
  allMemos.forEach(m => { counts[m.category] = (counts[m.category] || 0) + 1; });
  const cats = ["全部", ...categories];
  $("nav").innerHTML = cats.map(c => `
    <div class="nav-item ${c === currentCat ? "active" : ""}" data-cat="${c}">
      <span>${c}</span>
      <span class="num">${c === "全部" ? allMemos.length : (counts[c] || 0)}</span>
    </div>
  `).join("");
}

function render() {
  renderNav();
  const list = $("list");
  const items = allMemos.filter(m => currentCat === "全部" || m.category === currentCat);
  if (!items.length) {
    list.innerHTML = `<div class="empty">${currentCat === "全部" ? "还没有灵感，写下第一条吧" : "这里还没有内容"}</div>`;
    return;
  }
  const contents = items.map(m => m.content || m.preview);
  list.innerHTML = items.map(() => `
    <div class="memo-card">
      <div class="cat" title="点此改分类"></div>
      <div class="text"></div>
      <div class="meta">
        <span class="meta-info"></span>
        <button class="del-btn">删除</button>
      </div>
    </div>
  `).join("");
  items.forEach((m, i) => {
    const card = list.querySelectorAll(".memo-card")[i];
    card.dataset.file = m.file;
    card.querySelector(".cat").textContent = m.category;
    card.querySelector(".text").textContent = contents[i];
    card.querySelector(".meta-info").textContent = `${m.date} ${m.time}`;
  });
}

async function loadMemos() {
  try {
    const res = await fetch("/api/memos");
    const data = await res.json();
    allMemos = data.items;
    render();
  } catch (e) {
    $("list").innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
}

async function sendMemo() {
  const text = $("input").value.trim();
  if (!text) { toast("先写点东西再丢"); return; }
  const btn = $("send");
  btn.disabled = true;
  $("status").textContent = "分类中…";
  try {
    const res = await fetch("/api/classify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, source: "web" })
    });
    const data = await res.json();
    if (data.error) { toast(data.error); $("status").textContent = ""; }
    else {
      $("input").value = "";
      $("status").textContent = "";
      toast(`已归档 → ${data.category}`);
      await loadMemos();
    }
  } catch (e) {
    toast("分类失败，稍后再试");
    $("status").textContent = "";
  } finally {
    btn.disabled = false;
  }
}

// 侧边栏开关（手机）
function closeSidebar() { $("sidebar").classList.remove("open"); $("mask").classList.remove("show"); }
$("hamburger").addEventListener("click", () => {
  $("sidebar").classList.toggle("open");
  $("mask").classList.toggle("show");
});
$("mask").addEventListener("click", closeSidebar);
$("nav").addEventListener("click", e => {
  const item = e.target.closest(".nav-item");
  if (!item) return;
  currentCat = item.dataset.cat;
  closeSidebar();
  render();
});


// 改分类：点击卡片分类标签弹出菜单
$("list").addEventListener("click", e => {
  const catEl = e.target.closest(".cat");
  if (!catEl) return;
  const card = catEl.closest(".memo-card");
  const file = card.dataset.file;
  const cur = catEl.textContent;
  closeCatMenu();
  const menu = document.createElement("div");
  menu.className = "cat-menu";
  menu.id = "catMenu";
  menu.innerHTML = `<div class="cat-menu-title">移动到分类</div>` +
    categories.map(c => `<div class="cat-menu-item ${c === cur ? "active" : ""}" data-cat="${c}">${c}</div>`).join("");
  document.body.appendChild(menu);
  menu.dataset.file = file;
  const rect = menu.getBoundingClientRect();
  const x = e.clientX, y = e.clientY;
  menu.style.left = Math.min(x, window.innerWidth - rect.width - 8) + "px";
  menu.style.top = Math.min(y, window.innerHeight - rect.height - 8) + "px";
  setTimeout(() => document.addEventListener("click", closeCatMenu), 0);
});

// 处理改分类菜单点击（和分类管理菜单共用 closeCatMenu）
document.addEventListener("click", async e => {
  const item = e.target.closest(".cat-menu-item[data-cat]");
  const menu = document.getElementById("catMenu");
  if (!item || !menu || !menu.dataset.file) return;
  const target = item.dataset.cat;
  const file = menu.dataset.file;
  closeCatMenu();
  if (target === "") return;
  try {
    const res = await fetch("/api/memos/move", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file, category: target })
    });
    const data = await res.json();
    if (data.error) { toast(data.error); return; }
    toast(`已移动到 ${target}`);
    await loadMemos();
  } catch (err) {
    toast("移动失败，稍后再试");
  }
});

// 删除 memo（事件委托）
$("list").addEventListener("click", async e => {
  const btn = e.target.closest(".del-btn");
  if (!btn) return;
  const card = btn.closest(".memo-card");
  const file = card.dataset.file;
  if (!file) return;
  if (!confirm(`删除这条？\n\n${file}`)) return;
  try {
    const res = await fetch(`/api/memos?file=${encodeURIComponent(file)}`, { method: "DELETE" });
    const data = await res.json();
    if (data.error) { toast(data.error); return; }
    toast("已删除");
    await loadMemos();
  } catch (e) {
    toast("删除失败，稍后再试");
  }
});

// 导出当前分类（全部=导出全部）
$("exportBtn").addEventListener("click", () => {
  const cat = currentCat === "全部" ? "" : encodeURIComponent(currentCat);
  window.location.href = `/api/export?category=${cat}`;
  toast("开始导出…");
});

// 添加分类
$("addCatBtn").addEventListener("click", async () => {
  const name = prompt("新分类名称：");
  if (!name || !name.trim()) return;
  try {
    const res = await fetch("/api/categories", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.trim() })
    });
    const data = await res.json();
    if (data.error) { toast(data.error); return; }
    toast("分类已添加");
    await refreshAll();
  } catch (e) {
    toast("添加失败，稍后再试");
  }
});

// 分类管理（改名/删除/排序）— 长按或右键分类项弹出菜单
let longPressTimer = null;
$("nav").addEventListener("contextmenu", e => {
  const item = e.target.closest(".nav-item");
  if (!item || item.dataset.cat === "全部") return;
  e.preventDefault();
  showCatMenu(item, e.clientX, e.clientY);
});
$("nav").addEventListener("pointerdown", e => {
  const item = e.target.closest(".nav-item");
  if (!item || item.dataset.cat === "全部") return;
  longPressTimer = setTimeout(() => showCatMenu(item, e.clientX, e.clientY), 600);
});
$("nav").addEventListener("pointerup", () => clearTimeout(longPressTimer));
$("nav").addEventListener("pointerleave", () => clearTimeout(longPressTimer));

function showCatMenu(item, x, y) {
  closeCatMenu();
  const cat = item.dataset.cat;
  const menu = document.createElement("div");
  menu.className = "cat-menu";
  menu.id = "catMenu";
  menu.innerHTML = `
    <div class="cat-menu-title">${cat}</div>
    <div class="cat-menu-item" data-act="rename">改名</div>
    <div class="cat-menu-item" data-act="up">上移</div>
    <div class="cat-menu-item" data-act="down">下移</div>
    <div class="cat-menu-item danger" data-act="delete">删除分类</div>
  `;
  document.body.appendChild(menu);
  const rect = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, window.innerWidth - rect.width - 8) + "px";
  menu.style.top = Math.min(y, window.innerHeight - rect.height - 8) + "px";
  menu.dataset.cat = cat;
  setTimeout(() => document.addEventListener("click", closeCatMenu), 0);
}

function closeCatMenu() {
  const m = document.getElementById("catMenu");
  if (m) m.remove();
  document.removeEventListener("click", closeCatMenu);
}

document.addEventListener("click", async e => {
  const act = e.target.closest(".cat-menu-item");
  if (!act) return;
  e.stopPropagation();
  const menu = document.getElementById("catMenu");
  if (!menu || menu.dataset.file) return;  // 无菜单或改分类菜单时跳过
  const cat = menu.dataset.cat;
  const action = act.dataset.act;
  closeCatMenu();
  try {
    if (action === "rename") {
      const name = prompt("新名称：", cat);
      if (!name || !name.trim() || name.trim() === cat) return;
      const res = await fetch("/api/categories/rename", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ old: cat, new: name.trim() })
      });
      const data = await res.json();
      if (data.error) { toast(data.error); return; }
      if (currentCat === cat) currentCat = name.trim();
      toast("已改名");
      await refreshAll();
    } else if (action === "up" || action === "down") {
      const idx = categories.indexOf(cat);
      const swap = action === "up" ? idx - 1 : idx + 1;
      if (swap < 0 || swap >= categories.length) { toast("已经在边缘"); return; }
      [categories[idx], categories[swap]] = [categories[swap], categories[idx]];
      const res = await fetch("/api/categories/order", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ categories })
      });
      const data = await res.json();
      if (data.error) { toast(data.error); return; }
      toast("已调整顺序");
      await refreshAll();
    } else if (action === "delete") {
      const cnt = allMemos.filter(m => m.category === cat).length;
      if (!confirm(`删除分类「${cat}」？\n${cnt > 0 ? `分类下有 ${cnt} 条内容会被删除！` : "该分类下没有内容。"}`)) return;
      // 删除分类 = 删除文件夹 + 从配置移除（后端支持）
      const res = await fetch("/api/categories", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: cat })
      });
      const data = await res.json();
      if (data.error) { toast(data.error); return; }
      if (currentCat === cat) currentCat = "全部";
      toast("分类已删除");
      await refreshAll();
    }
  } catch (err) {
    toast("操作失败，稍后再试");
  }
});

$("send").addEventListener("click", sendMemo);
$("input").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") sendMemo();
});

// 小猫动态图（SVG 线条动画）
const CAT_SVG = `
<svg width="120" height="72" viewBox="0 0 120 72" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <g class="cat-body">
    <path d="M25 55 C25 38 40 28 60 28 C80 28 95 38 95 55 Z"/>
    <path d="M35 28 Q 38 16 46 14 Q 44 24 44 28"/>
    <path d="M85 28 Q 82 16 74 14 Q 76 24 76 28"/>
  </g>
  <g class="cat-eyes">
    <circle cx="48" cy="42" r="1.8"/>
    <circle cx="72" cy="42" r="1.8"/>
  </g>
  <path class="cat-nose" d="M60 45 L58 48 L62 48 Z"/>
  <path class="cat-mouth" d="M58 48 Q60 50 62 48"/>
  <g class="cat-tail">
    <path d="M95 52 Q 110 52 108 40 Q 107 32 100 34"/>
  </g>
  <g class="cat-whisker">
    <path d="M40 46 L28 44 M40 49 L28 50"/>
    <path d="M80 46 L92 44 M80 49 L92 50"/>
  </g>
</svg>
`;

const catCSS = `
.cat-art svg { max-width: 120px; }
.cat-art svg .cat-body, .cat-art svg .cat-eyes, .cat-art svg .cat-nose, .cat-art svg .cat-mouth, .cat-art svg .cat-whisker {
  stroke-dasharray: 400; stroke-dashoffset: 400;
  animation: draw 1.2s ease forwards;
}
.cat-art svg .cat-body { animation-delay: 0s; }
.cat-art svg .cat-eyes { animation-delay: .3s; }
.cat-art svg .cat-nose, .cat-art svg .cat-mouth { animation-delay: .5s; }
.cat-art svg .cat-whisker { animation-delay: .7s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cat-art svg .cat-tail {
  stroke-dasharray: 100; stroke-dashoffset: 100;
  animation: tail 1.6s ease-in-out infinite alternate;
}
@keyframes tail { to { stroke-dashoffset: 0; } }

function renderCat() {
